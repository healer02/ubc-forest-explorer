<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UBC Urban Forest Explorer</title>
<meta name="description" content="Learn UBC campus trees with spaced repetition, your own photos and stories.">
<meta name="theme-color" content="#eef2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UBC Forest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<main id="view" tabindex="-1">
  <p class="loading">Loading trees…</p>
</main>

<nav class="tabbar" aria-label="Main">
  <a href="#/today" data-tab="today">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
    <span>Today</span>
  </a>
  <a href="#/review" data-tab="review">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6.5" width="13" height="14" rx="2.5"/><path d="M8 3.5h10a2.5 2.5 0 0 1 2.5 2.5v11"/></svg>
    <span>Review</span>
  </a>
  <a href="#/add" data-tab="add">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.8l1.4-2h4.6l1.4 2h1.8A2.5 2.5 0 0 1 20 8.5V17a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17z"/><path d="M12 10v6M9 13h6"/></svg>
    <span>Add</span>
  </a>
  <a href="#/progress" data-tab="progress">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-7M12 14c-4 0-6.5-2.6-6.5-6A6.5 6.5 0 0 1 12 1.8 6.5 6.5 0 0 1 18.5 8c0 3.4-2.5 6-6.5 6zM12 14l-3-3M12 11.5l2.5-2.5"/></svg>
    <span>Progress</span>
  </a>
</nav>

<div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
